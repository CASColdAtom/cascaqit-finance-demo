name: Windows Offline Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/biomedicine-demo
    paths:
      - ".github/workflows/windows-offline-acceptance.yml"
      - "frontend/**"
      - "packaging/windows/**"
      - "scripts/build_windows_offline_bundle.py"
      - "src/**"
      - "tests/unit/test_packaging.py"
      - "vendor/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  windows-offline-x64:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out industry workbench
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install "build>=1.2" "hatchling>=1.27" "packaging>=24"
          Push-Location frontend
          npm ci
          Pop-Location

      - name: Prepare verified Windows dependency cache
        shell: pwsh
        env:
          CACHE_URL: https://github.com/CASColdAtom/cascaqit-finance-demo/releases/download/v0.1.1/cascaqit-finance-demo-windows-x64-py311.zip
          CACHE_SHA256: 4deb45cdd37b07034512aec89d5f7402152ebbdff8382fecff738bbbd593198a
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "windows-cache.zip"
          $cacheRoot = Join-Path $env:RUNNER_TEMP "windows-cache"
          Invoke-WebRequest -Uri $env:CACHE_URL -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CACHE_SHA256) {
            throw "Windows cache SHA256 mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $cacheRoot
          $bundleCache = Join-Path $cacheRoot "cascaqit-finance-demo-windows-x64-py311"
          python -m pip download --dest (Join-Path $bundleCache "wheelhouse") --only-binary=:all: "threadpoolctl==3.6.0"
          "CASCAQIT_WINDOWS_CACHE_ROOT=$bundleCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows offline bundle
        shell: pwsh
        run: |
          python scripts/build_windows_offline_bundle.py --cache-root $env:CASCAQIT_WINDOWS_CACHE_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Windows bundle build failed: $LASTEXITCODE" }
          Get-Content offline/cascaqit-finance-demo-windows-x64-py311/bundle-info.json
          Get-FileHash offline/cascaqit-finance-demo-windows-x64-py311.zip -Algorithm SHA256

      - name: Verify and install entirely offline
        shell: pwsh
        run: |
          $bundle = Resolve-Path "offline/cascaqit-finance-demo-windows-x64-py311"
          $env:PIP_NO_INDEX = "1"
          $env:NO_PROXY = "*"
          $env:no_proxy = "*"
          $verify = Start-Process cmd.exe -ArgumentList "/d", "/c", "VERIFY.bat" -WorkingDirectory $bundle -Wait -PassThru -NoNewWindow
          if ($verify.ExitCode -ne 0) { throw "VERIFY.bat failed: $($verify.ExitCode)" }
          $install = Start-Process cmd.exe -ArgumentList "/d", "/c", "INSTALL.bat" -WorkingDirectory $bundle -Wait -PassThru -NoNewWindow
          if ($install.ExitCode -ne 0) { throw "INSTALL.bat failed: $($install.ExitCode)" }
          & (Join-Path $bundle "runtime/venv/Scripts/python.exe") -c "from importlib.metadata import version; assert version('cascaqit-finance-demo') == '0.2.0'; assert version('cascaqit') == '1.0.5a0'"

      - name: Start through RUN.bat and probe installed application
        shell: pwsh
        run: |
          $bundle = Resolve-Path "offline/cascaqit-finance-demo-windows-x64-py311"
          $env:CASCAQIT_INDUSTRY_PORT = "8765"
          $process = Start-Process cmd.exe -ArgumentList "/d", "/c", "RUN.bat" -WorkingDirectory $bundle -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt += 1) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "RUN.bat did not expose a healthy service" }
            $domains = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/domains"
            $biomedicine = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/domains/biomedicine/scenarios"
            $materials = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/domains/materials/scenarios"
            $page = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/"
            if ($domains.domains.Count -ne 3) { throw "Expected three industry domains" }
            if ($biomedicine.scenarios.Count -ne 6) { throw "Expected six biomedicine scenarios" }
            if ($materials.scenarios.Count -ne 2) { throw "Expected two materials scenarios" }
            if ($page.Content -notmatch "<div id=.root.></div>") { throw "Packaged frontend entry is missing" }
          } finally {
            taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cascaqit-industry-workbench-windows-x64-${{ github.sha }}
          path: offline/cascaqit-finance-demo-windows-x64-py311.zip
          if-no-files-found: error
          retention-days: 30

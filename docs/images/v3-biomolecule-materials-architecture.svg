  <rect class="material" x="620" y="286" width="230" height="90" rx="8"/>
  <text class="node-title" x="735" y="320">Materials QUBO Adapter</text>
  <text class="node-subtitle" x="735" y="344">周期晶格 · 对称性</text>
  <text class="node-subtitle" x="735" y="362">缺陷 / 吸附离线能量</text>

  <rect class="analog" x="890" y="286" width="230" height="90" rx="8"/>
  <text class="node-title" x="1005" y="320">Materials Analog Adapter</text>
  <text class="node-subtitle" x="1005" y="344">有效晶格 · 缺陷预设</text>
  <text class="node-subtitle" x="1005" y="362">模型与坐标来源映射</text>

  <rect class="node" x="80" y="488" width="230" height="90" rx="8"/>
  <text class="node-title" x="195" y="522">RNA 配对 QUBO</text>
  <text class="node-subtitle" x="195" y="546">配对、互斥、茎</text>
  <text class="node-subtitle" x="195" y="564">完整贡献账本</text>

  <rect class="node" x="350" y="488" width="230" height="90" rx="8"/>
  <text class="node-title" x="465" y="522">构象路径 QUBO</text>
  <text class="node-subtitle" x="465" y="546">起终点、流守恒</text>
  <text class="node-subtitle" x="465" y="564">路径连续与裁剪证据</text>

  <rect class="node" x="620" y="488" width="230" height="90" rx="8"/>
  <text class="node-title" x="735" y="522">缺陷-吸附 QUBO</text>
  <text class="node-subtitle" x="735" y="546">占位、计量、覆盖度</text>
  <text class="node-subtitle" x="735" y="564">近邻与周期约束</text>

  <rect class="analog" x="890" y="488" width="230" height="90" rx="8"/>
  <text class="node-title" x="1005" y="516">AnalogExperimentDefinition</text>
  <text class="node-subtitle" x="1005" y="540">Rydberg 布局 · 初态 · 脉冲</text>

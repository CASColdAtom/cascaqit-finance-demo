  <text class="node-subtitle" x="340" y="748">能力快照 · 成本/规模门禁 · 稳定 hash</text>

  <rect class="shared" x="680" y="706" width="360" height="52" rx="8"/>
  <text class="node-title" x="860" y="729">LocalJobManager</text>
  <text class="node-subtitle" x="860" y="748">有界队列 · 部分成功 · 原子持久化</text>

  <rect class="shared" x="100" y="884" width="230" height="92" rx="8"/>
  <text class="node-title" x="215" y="918">ProblemExecutor</text>
  <text class="node-subtitle" x="215" y="942">Digital / Hybrid</text>
  <text class="node-subtitle" x="215" y="960">QUBO 编译与解码编排</text>

  <rect class="node" x="390" y="884" width="180" height="92" rx="8"/>
  <text class="node-title" x="480" y="918">CASCAQit</text>
  <text class="node-subtitle" x="480" y="942">QAOA · Hybrid D-A-D</text>
  <text class="node-subtitle" x="480" y="960">LocalBackend</text>

  <rect class="analog" x="650" y="884" width="230" height="92" rx="8"/>
  <text class="node-title" x="765" y="918">AnalogExecutor</text>
  <text class="node-subtitle" x="765" y="942">纯 Analog 门禁与轨迹编排</text>
  <text class="node-subtitle" x="765" y="960">无 Digital residual</text>

  <rect class="analog" x="940" y="884" width="180" height="92" rx="8"/>
  <text class="node-title" x="1030" y="912">CASCAQit AHS</text>
  <text class="node-subtitle" x="1030" y="936">AHSProgram</text>
  <text class="node-subtitle" x="1030" y="954">LocalAhsSimulator</text>

  <rect class="node" x="160" y="1112" width="340" height="64" rx="8"/>
  <text class="node-title" x="330" y="1138">优化结果解码与经典对照</text>
  <text class="node-subtitle" x="330" y="1160">Top-K 可行解 · QUBO 分解 · 审计</text>

  <rect class="analog" x="700" y="1112" width="340" height="64" rx="8"/>
  <text class="node-title" x="870" y="1138">AHS 时序解码与精确对照</text>
  <text class="node-subtitle" x="870" y="1160">占据 · 磁化 · 二点关联 · 传播/局域化</text>

  <line x1="72" y1="1268" x2="112" y2="1268" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="124" y="1272" font-size="12" fill="#4b5563">Digital / Hybrid QUBO 执行流</text>
  <line x1="410" y1="1268" x2="450" y2="1268" stroke="#059669" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <text x="462" y="1272" font-size="12" fill="#4b5563">纯 Analog / AHS 执行流</text>
  <text x="72" y="1295" font-size="11.5" fill="#4b5563">所有执行均为本地模拟；材料晶格坐标、有效模型位点与 Rydberg 编译坐标分别审计。</text>
</svg>

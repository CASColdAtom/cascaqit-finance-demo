<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" width="1200" height="1320" role="img" aria-labelledby="title desc">
  <title id="title">中科酷原行业量子实验台 V3 目标架构</title>
  <desc id="desc">金融、生物医药和材料科学共用领域 API、实验规划、持久任务与审计。RNA、蛋白构象和材料构型进入 QUBO Digital 或 Hybrid 路线；材料缺陷晶格动力学进入独立的纯 Analog AHS 路线。</desc>
  <style>
    text { font-family: 'Microsoft YaHei', '微软雅黑', SimHei, Arial, sans-serif; fill: #111827; letter-spacing: 0; }
    .layer { fill: #f8fbff; stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 7 5; }
    .node { fill: #ffffff; stroke: #2563eb; stroke-width: 1.8; }
    .rna { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
    .protein { fill: #f0fdf4; stroke: #2563eb; stroke-width: 1.8; }
    .material { fill: #fff7ed; stroke: #2563eb; stroke-width: 1.8; }
    .analog { fill: #f0fdfa; stroke: #2563eb; stroke-width: 2; }
    .shared { fill: #f5f3ff; stroke: #2563eb; stroke-width: 1.8; }
    .layer-label { fill: #1d4ed8; font-size: 13px; font-weight: 700; }
    .node-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .node-subtitle { fill: #4b5563; font-size: 11.5px; text-anchor: middle; }
    .arrow-label { fill: #1d4ed8; font-size: 11.5px; font-weight: 600; text-anchor: middle; }
    .analog-label { fill: #047857; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .flow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow-blue); }
    .rail { fill: none; stroke: #2563eb; stroke-width: 2; }
    .analog-flow { fill: none; stroke: #059669; stroke-width: 2.4; marker-end: url(#arrow-green); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1200" height="1320" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700">中科酷原行业量子实验台 V3 目标架构</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#4b5563">离散优化与原生 Analog 多体动力学并列，执行语义严格隔离</text>
  <rect x="1010" y="22" width="130" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="1075" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">PLANNED</text>

  <rect class="layer" x="50" y="78" width="1100" height="140" rx="8"/>
  <text class="layer-label" x="70" y="102">入口与领域路由</text>
  <rect class="layer" x="50" y="242" width="1100" height="170" rx="8"/>
  <text class="layer-label" x="70" y="266">领域适配层</text>
  <rect class="layer" x="50" y="436" width="1100" height="175" rx="8"/>
  <text class="layer-label" x="70" y="460">实验定义层</text>
  <rect class="layer" x="50" y="662" width="1100" height="130" rx="8"/>
  <text class="layer-label" x="70" y="686">公共规划与任务层</text>
  <rect class="layer" x="50" y="836" width="1100" height="185" rx="8"/>
  <text class="layer-label" x="70" y="860">隔离执行层</text>
  <rect class="layer" x="50" y="1065" width="1100" height="145" rx="8"/>
  <text class="layer-label" x="70" y="1089">结果、经典对照与审计</text>

  <path class="flow" d="M 380 155 H 460"/>
  <path class="flow" d="M 740 155 H 820"/>
  <text class="arrow-label" x="420" y="143">领域请求</text>
  <text class="arrow-label" x="780" y="143">目录解析</text>

  <path class="rail" d="M 960 190 V 229 H 195"/>
  <path class="flow" d="M 195 229 V 286"/>
  <path class="flow" d="M 465 229 V 286"/>
  <path class="flow" d="M 735 229 V 286"/>
  <path class="flow" d="M 1005 229 V 286"/>

  <path class="flow" d="M 195 376 V 488"/>
  <path class="flow" d="M 465 376 V 488"/>
  <path class="flow" d="M 735 376 V 488"/>
  <path class="analog-flow" d="M 1005 376 V 488"/>

  <path class="rail" d="M 195 578 V 632 H 1005 V 578"/>
  <path class="rail" d="M 465 578 V 632"/>
  <path class="rail" d="M 735 578 V 632"/>
  <path class="flow" d="M 600 632 V 706"/>

  <path class="flow" d="M 520 732 H 680"/>
  <text class="arrow-label" x="600" y="720">稳定实验计划</text>
  <path class="flow" d="M 770 758 V 814 H 215 V 884"/>
  <path class="analog-flow" d="M 950 758 V 814 H 765 V 884"/>
  <text class="arrow-label" x="430" y="805">optimization</text>
  <text class="analog-label" x="860" y="805">analog_ahs</text>

  <path class="flow" d="M 330 930 H 390"/>
  <path class="analog-flow" d="M 880 930 H 940"/>
  <path class="flow" d="M 480 976 V 1043 H 330 V 1112"/>
  <path class="analog-flow" d="M 1030 976 V 1043 H 870 V 1112"/>

  <rect class="node" x="100" y="120" width="280" height="70" rx="8"/>
  <text class="node-title" x="240" y="149">React 行业工作台</text>
  <text class="node-subtitle" x="240" y="173">金融 / 生物医药 / 材料科学</text>

  <rect class="node" x="460" y="120" width="280" height="70" rx="8"/>
  <text class="node-title" x="600" y="149">统一领域 API</text>
  <text class="node-subtitle" x="600" y="173">分析 · 运行 · 持久任务</text>

  <rect class="node" x="820" y="120" width="280" height="70" rx="8"/>
  <text class="node-title" x="960" y="149">DomainRegistry</text>
  <text class="node-subtitle" x="960" y="173">领域与场景发现</text>


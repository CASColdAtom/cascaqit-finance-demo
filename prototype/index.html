<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CASCAQit Finance Demo Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f6f5;
      --surface: #ffffff;
      --surface-soft: #edf2ef;
      --foreground: #17211c;
      --muted: #5c6b64;
      --border: #d7dfda;
      --primary: #146c43;
      --primary-strong: #0d5533;
      --blue: #2568a8;
      --amber: #b66f12;
      --red: #b4473d;
      --violet: #7256a3;
      --grid: #e5eae7;
      --shadow: 0 8px 22px rgba(24, 49, 37, 0.08);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--foreground);
    }

    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(37, 104, 168, 0.28);
      outline-offset: 2px;
    }

    .app-shell { min-height: 100vh; }

    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: baseline; gap: 9px; min-width: 230px; }
    .brand-name { font-size: 18px; font-weight: 500; }
    .brand-product { color: var(--muted); }

    .status-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
    .status-dot.amber { background: var(--amber); }

    .language-button, .secondary-button, .run-button, .tab-button, .case-button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--foreground);
    }
    .language-button { min-width: 44px; min-height: 30px; padding: 4px 9px; }

    .workspace {
      display: grid;
      grid-template-columns: 205px 340px minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }

    .case-nav {
      padding: 20px 12px;
      background: #e9eeeb;
      border-right: 1px solid var(--border);
    }
    .nav-label {
      margin: 0 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }
    .case-list { display: grid; gap: 6px; }
    .case-button {
      width: 100%;
      min-height: 56px;
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 8px;
      padding: 8px;
      text-align: left;
      background: transparent;
      border-color: transparent;
    }
    .case-button:hover { background: rgba(255, 255, 255, 0.72); }
    .case-button[aria-pressed="true"] {
      color: var(--primary-strong);
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow);
    }
    .case-index {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      background: rgba(20, 108, 67, 0.11);
      color: var(--primary-strong);
      font-size: 12px;
      font-weight: 500;
    }
    .case-title { display: block; font-weight: 500; }
    .case-kind { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    .control-panel {
      min-width: 0;
      padding: 20px 16px;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    .control-panel h2 { margin: 0; font-size: 16px; font-weight: 500; }
    .control-desc { min-height: 40px; margin: 6px 0 16px; color: var(--muted); }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field-header { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .field label { font-weight: 500; }
    .field-output { color: var(--primary-strong); font-variant-numeric: tabular-nums; }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--foreground);
    }
    input[type="range"] { width: 100%; accent-color: var(--primary); }
    .range-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .weight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .weight-grid .field { min-width: 0; }
    .control-section-title { margin: 3px 0 10px; color: var(--muted); font-size: 12px; font-weight: 500; }
    details { margin: 6px 0 18px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    summary { padding: 11px 0; font-weight: 500; cursor: pointer; }
    .advanced-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 3px 0 12px; }
    .advanced-grid .field { margin: 0; }
    .advanced-grid label { font-size: 12px; color: var(--muted); }
    .data-editor { max-height: 270px; margin-bottom: 10px; overflow: auto; border: 1px solid var(--border); border-radius: 5px; }
    .data-editor table { min-width: 430px; font-size: 12px; }
    .data-editor th, .data-editor td { padding: 6px 7px; }
    .data-editor input[type="number"] { min-height: 29px; padding: 3px 5px; }
    .data-editor input[type="checkbox"] { accent-color: var(--primary); }
    .editor-note { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    .run-button {
      width: 100%;
      min-height: 42px;
      padding: 8px 12px;
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
      font-weight: 500;
    }
    .run-button:hover { background: var(--primary-strong); }
    .run-button:disabled { cursor: wait; opacity: 0.68; }
    .run-meta { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .run-meta strong { color: var(--foreground); font-weight: 500; }

    main { min-width: 0; padding: 20px 24px 36px; }
    .content-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .content-heading h1 { margin: 0; font-size: 22px; font-weight: 500; }
    .content-heading p { max-width: 760px; margin: 6px 0 0; color: var(--muted); }
    .result-state { display: inline-flex; align-items: center; gap: 7px; color: var(--primary-strong); white-space: nowrap; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }
    .model-strip {
      display: flex;
      align-items: center;
      gap: 0;
      margin: -6px 0 18px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      overflow-x: auto;
      white-space: nowrap;
    }
    .model-item { padding: 0 14px; border-right: 1px solid var(--border); }
    .model-item:first-child { padding-left: 0; }
    .model-item:last-child { border-right: 0; }
    .model-item strong { margin-left: 5px; color: var(--foreground); font-weight: 500; }
    .metric-card {
      min-width: 0;
      padding: 13px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .metric-label { color: var(--muted); }
    .metric-value { margin-top: 5px; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .metric-context { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-button {
      min-height: 38px;
      padding: 7px 13px;
      border-color: transparent;
      border-radius: 5px 5px 0 0;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
    }
    .tab-button[aria-selected="true"] {
      color: var(--primary-strong);
      background: var(--surface);
      border-color: var(--border);
      border-bottom-color: var(--surface);
      margin-bottom: -1px;
    }

    .view { padding-top: 18px; }
    .view-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.8fr); gap: 18px; align-items: start; }
    .view-grid.equal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .plot-block { min-width: 0; margin: 0; }
    .plot-block figcaption, .section-title { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px; font-weight: 500; }
    .plot-note { color: var(--muted); font-size: 12px; font-weight: 400; }
    .chart-frame {
      min-height: 300px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .chart-frame.compact { min-height: 240px; }
    .chart-frame svg { display: block; width: 100%; height: auto; }
    .chart-frame text { font-family: inherit; fill: var(--muted); font-size: 12px; }
    .chart-frame .axis-label { fill: var(--foreground); font-size: 12px; }
    .chart-frame .grid-line { stroke: var(--grid); stroke-width: 1; }
    .chart-frame .axis-line { stroke: #9daba3; stroke-width: 1; }
    .chart-frame .series-line { fill: none; stroke: var(--blue); stroke-width: 2.5; }
    .chart-frame .series-line.secondary { stroke: var(--amber); }
    .chart-frame .series-line.tertiary { stroke: var(--violet); }
    .legend-row { display: flex; gap: 14px; margin: 8px 0 0; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
    .legend-key { display: inline-flex; align-items: center; gap: 5px; }
    .legend-swatch { width: 12px; height: 3px; background: var(--blue); }
    .legend-swatch.amber { background: var(--amber); }
    .legend-swatch.red { background: var(--red); }
    .legend-swatch.violet { background: var(--violet); }

    .table-wrap { margin-top: 18px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    th, td { padding: 10px 11px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 500; }
    td.numeric, th.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    .selected-row { background: rgba(20, 108, 67, 0.06); }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; background: var(--surface-soft); color: var(--foreground); font-size: 12px; }
    .tag.success { background: rgba(20, 108, 67, 0.11); color: var(--primary-strong); }
    .tag.warn { background: rgba(182, 111, 18, 0.12); color: #7b4707; }

    .audit-list { display: grid; grid-template-columns: 190px 1fr; background: var(--surface); border-top: 1px solid var(--border); }
    .audit-list dt, .audit-list dd { margin: 0; padding: 11px; border-bottom: 1px solid var(--border); }
    .audit-list dt { color: var(--muted); }
    .audit-list dd { overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .action-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .followup-plot { margin-top: 18px; }
    .secondary-button { min-height: 36px; padding: 7px 11px; }
    .secondary-button:hover { border-color: #9aa9a1; }

    .tooltip {
      position: fixed;
      z-index: 20;
      display: none;
      max-width: 220px;
      padding: 7px 9px;
      border-radius: 5px;
      background: #17211c;
      color: #ffffff;
      pointer-events: none;
      box-shadow: var(--shadow);
      font-size: 12px;
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    @media (max-width: 1180px) {
      .workspace { grid-template-columns: 190px minmax(0, 1fr); }
      .control-panel { grid-column: 2; border-right: 0; border-bottom: 1px solid var(--border); }
      main { grid-column: 2; }
      .control-panel form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
      .control-panel details, .control-panel .run-button, .control-panel .run-meta { grid-column: 1 / -1; }
    }

    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-wrap: wrap; padding: 10px 14px; }
      .brand { min-width: 0; flex-direction: column; gap: 2px; }
      .brand-product { font-size: 12px; }
      .status-row { width: 100%; justify-content: flex-start; gap: 5px; }
      .status-pill { min-height: 26px; padding: 3px 6px; font-size: 11px; }
      .language-button { margin-left: auto; }
      .workspace { display: block; }
      .case-nav { padding: 10px; border-right: 0; border-bottom: 1px solid var(--border); }
      .nav-label { display: none; }
      .case-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .case-button { min-height: 48px; grid-template-columns: 1fr; text-align: center; }
      .case-index, .case-kind { display: none; }
      .control-panel { padding: 16px 14px; }
      .control-panel form { display: block; }
      main { padding: 16px 14px 28px; }
      .content-heading { display: block; }
      .result-state { margin-top: 9px; }
      .metric-grid { grid-template-columns: 1fr; }
      .model-strip { flex-wrap: wrap; gap: 8px 0; margin-top: 0; white-space: normal; overflow: visible; }
      .model-item { flex: 0 0 50%; border-right: 0; padding: 0; }
      .view-grid, .view-grid.equal { grid-template-columns: 1fr; }
      .chart-frame { min-height: 240px; }
      .audit-list { grid-template-columns: 1fr; }
      .audit-list dt { padding-bottom: 3px; border-bottom: 0; }
      .audit-list dd { padding-top: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="finance-app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">CASCAQit Finance</span>
        <span class="brand-product" data-zh="金融量子优化实验台" data-en="Quantum Optimization Lab">金融量子优化实验台</span>
      </div>
      <div class="status-row">
        <span class="status-pill"><span class="status-dot"></span><span data-zh="演示环境" data-en="Demo environment">演示环境</span></span>
        <span class="status-pill"><span class="status-dot amber"></span><span data-zh="合成数据" data-en="Synthetic data">合成数据</span></span>
        <button class="language-button" id="language-button" type="button" aria-label="Switch language">EN</button>
      </div>
    </header>

    <div class="workspace">
      <nav class="case-nav" aria-label="金融案例">
        <p class="nav-label" data-zh="金融案例" data-en="FINANCE CASES">金融案例</p>
        <div class="case-list">
          <button class="case-button" type="button" data-case="portfolio" aria-pressed="true">
            <span class="case-index">01</span>
            <span><span class="case-title" data-zh="投资组合" data-en="Portfolio">投资组合</span><span class="case-kind">QUBO · QAOA · 4</span></span>
          </button>
          <button class="case-button" type="button" data-case="settlement" aria-pressed="false">
            <span class="case-index">02</span>
            <span><span class="case-title" data-zh="交易结算" data-en="Settlement">交易结算</span><span class="case-kind">QUBO · Hybrid · 3</span></span>
          </button>
          <button class="case-button" type="button" data-case="fraud" aria-pressed="false">
            <span class="case-index">03</span>
            <span><span class="case-title" data-zh="调查编排" data-en="Review routing">调查编排</span><span class="case-kind">QUBO · QAOA · 3</span></span>
          </button>
          <button class="case-button" type="button" data-case="collateral" aria-pressed="false">
            <span class="case-index">04</span>
            <span><span class="case-title" data-zh="抵押品分配" data-en="Collateral">抵押品分配</span><span class="case-kind">QUBO · QAOA · 3</span></span>
          </button>
          <button class="case-button" type="button" data-case="treasury" aria-pressed="false">
            <span class="case-index">05</span>
            <span><span class="case-title" data-zh="流动性调度" data-en="Liquidity">流动性调度</span><span class="case-kind">QUBO · QAOA · 3</span></span>
          </button>
          <button class="case-button" type="button" data-case="credit" aria-pressed="false">
            <span class="case-index">06</span>
            <span><span class="case-title" data-zh="授信额度" data-en="Credit limits">授信额度</span><span class="case-kind">QUBO · QAOA · 3</span></span>
          </button>
          <button class="case-button" type="button" data-case="derivatives" aria-pressed="false">
            <span class="case-index">07</span>
            <span><span class="case-title" data-zh="衍生品定价" data-en="Derivatives">衍生品定价</span><span class="case-kind">Pricing · Digital · 4</span></span>
          </button>
        </div>
      </nav>

      <aside class="control-panel">
        <h2 id="control-title">投资组合参数</h2>
        <p class="control-desc" id="control-desc">调整目标权重、业务约束和候选数据。</p>
        <form id="case-form">
          <div id="business-controls"></div>
          <details id="data-details">
            <summary data-zh="业务数据与约束" data-en="Business data and constraints">业务数据与约束</summary>
            <div id="data-editor"></div>
          </details>
          <details id="solver-details">
            <summary data-zh="求解参数" data-en="Solver parameters">求解参数</summary>
            <div class="advanced-grid">
              <div class="field">
                <label for="layers">QAOA layers</label>
                <select id="layers"><option>1</option><option>2</option></select>
              </div>
              <div class="field">
                <label for="evaluations">Evaluations</label>
                <select id="evaluations"><option>10</option><option>14</option><option>20</option></select>
              </div>
              <div class="field">
                <label for="shots">Shots</label>
                <select id="shots"><option>256</option><option>512</option><option>1024</option></select>
              </div>
              <div class="field">
                <label for="seed">Seed</label>
                <input id="seed" type="number" value="23" min="1" max="9999">
              </div>
            </div>
          </details>
          <button class="run-button" id="run-button" type="submit" data-zh="运行优化" data-en="Run optimization">运行优化</button>
          <p class="run-meta"><strong id="run-status">已完成</strong> · <span id="run-detail">1.8 s · seed 23</span></p>
        </form>
      </aside>

      <main>
        <header class="content-heading">
          <div>
            <h1 id="page-title">多资产投资组合优化</h1>
            <p id="page-description">从 8 个跨行业合成资产中选择 4 个，同时控制收益、波动、行业集中度和防御资产下限。</p>
          </div>
          <div class="result-state"><span class="status-dot"></span><span id="result-state">约束检查通过</span></div>
        </header>

        <section class="metric-grid" id="metric-grid" aria-label="结果摘要"></section>
        <section class="model-strip" id="model-strip" aria-label="模型规模"></section>

        <div class="tabs" role="tablist" aria-label="结果视图">
          <button class="tab-button" type="button" data-tab="business" role="tab" aria-selected="true" data-zh="业务结果" data-en="Business result">业务结果</button>
          <button class="tab-button" type="button" data-tab="scenario" role="tab" aria-selected="false" data-zh="场景分析" data-en="Scenario analysis">场景分析</button>
          <button class="tab-button" type="button" data-tab="optimization" role="tab" aria-selected="false" data-zh="模型与求解" data-en="Model and solver">模型与求解</button>
          <button class="tab-button" type="button" data-tab="quantum" role="tab" aria-selected="false" data-zh="量子实验" data-en="Quantum experiment">量子实验</button>
          <button class="tab-button" type="button" data-tab="audit" role="tab" aria-selected="false" data-zh="审计证据" data-en="Audit evidence">审计证据</button>
        </div>

        <section class="view" id="view" role="tabpanel"></section>
      </main>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="status"></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const state = {
      caseId: "portfolio",
      tab: "business",
      lang: "zh",
      runCount: 1,
      scenarioByCase: { portfolio: "base", settlement: "daily", fraud: "account", collateral: "margin", treasury: "normal", credit: "prudent", derivatives: "call" }
    };

    const cases = {
      portfolio: {
        title: { zh: "多资产投资组合优化", en: "Multi-asset portfolio optimization" },
        description: { zh: "从 8 个跨行业合成资产中选择 4 个，同时控制收益、波动、行业集中度和防御资产下限。", en: "Select 4 of 8 cross-sector synthetic assets while balancing return, volatility, concentration, and defensive allocation." },
        controlTitle: { zh: "投资组合参数", en: "Portfolio parameters" },
        controlDesc: { zh: "调整目标权重、组合约束和候选资产数据。", en: "Adjust objective weights, portfolio constraints, and asset data." },
        metrics: [
          ["预期收益", "Expected return", "9.2%", "合成年化指标", "Synthetic annual metric"],
          ["组合波动率", "Portfolio volatility", "11.8%", "4 个等权持仓", "4 equal-weight positions"],
          ["压力损失", "Stress loss", "-6.4%", "利率 +100bp 场景", "Rates +100bp scenario"]
        ],
        scale: [12, 5, 74, 4096]
      },

    function normalCdf(x) {
      const t=1/(1+0.2316419*Math.abs(x));
      const d=0.3989423*Math.exp(-x*x/2);
      const p=1-d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
      return x>=0?p:1-p;
    }

    function blackScholesPrice(kind,spot,strike,vol,rate,maturity) {
      const root=vol*Math.sqrt(maturity);
      const d1=(Math.log(spot/strike)+(rate+vol*vol/2)*maturity)/root;
      const d2=d1-root;
      return kind==="put"
        ? strike*Math.exp(-rate*maturity)*normalCdf(-d2)-spot*normalCdf(-d1)
        : spot*normalCdf(d1)-strike*Math.exp(-rate*maturity)*normalCdf(d2);
    }

    function binomialPrice(kind,spot,strike,vol,rate,maturity,steps=256) {
      const dt=maturity/steps,u=Math.exp(vol*Math.sqrt(dt)),d=1/u;
      const growth=Math.exp(rate*dt),q=(growth-d)/(u-d),discount=Math.exp(-rate*dt);
      const values=Array.from({length:steps+1},(_,i)=>{
        const terminal=spot*Math.pow(u,steps-i)*Math.pow(d,i);
        return Math.max(kind==="put"?strike-terminal:terminal-strike,0);
      });
      for (let step=steps-1;step>=0;step-=1) {
        for (let i=0;i<=step;i+=1) values[i]=discount*(q*values[i]+(1-q)*values[i+1]);
      }
      return values[0];
    }

    const monteCarloCache=new Map();
    function deterministicMonteCarlo(kind,spot,strike,vol,rate,maturity,paths,barrier,seed) {
      const key=[kind,spot,strike,vol,rate,maturity,paths,barrier,seed].join("|");
      if (monteCarloCache.has(key)) return monteCarloCache.get(key);
      let randomState=(seed>>>0)||23;
      const random=()=>{randomState+=0x6D2B79F5;let t=randomState;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};
      const observations=kind==="asian"?12:24,dt=maturity/observations,drift=(rate-vol*vol/2)*dt,diffusion=vol*Math.sqrt(dt),discount=Math.exp(-rate*maturity);
      let sum=0,sumSquares=0,knockedOut=0;
      for (let path=0;path<paths;path+=1) {
        let current=spot,total=0,maximum=spot;
        for (let step=0;step<observations;step+=1) {
          const u1=Math.max(random(),1e-12),u2=random();
          const z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
          current*=Math.exp(drift+diffusion*z);total+=current;maximum=Math.max(maximum,current);
        }
        const knocked=kind==="barrier"&&maximum>=barrier;
        if (knocked) knockedOut+=1;
        const terminalReference=kind==="asian"?total/observations:current;
        const payoff=knocked?0:Math.max(terminalReference-strike,0);
        const discounted=discount*payoff;
        sum+=discounted;sumSquares+=discounted*discounted;
      }
      const price=sum/paths;
      const variance=Math.max(0,sumSquares/paths-price*price);
      const result={price,standardError:Math.sqrt(variance/paths),knockOutProbability:knockedOut/paths};
      monteCarloCache.set(key,result);
      return result;
    }

    function derivativeCalculation() {
      const spot=Number(document.getElementById("primary-range")?.value||100),vol=Number(document.getElementById("secondary-range")?.value||24)/100,rate=Number(document.getElementById("tertiary-range")?.value||3)/100;
      const strike=Number(document.getElementById("case-option")?.value||100),maturity=Number(document.getElementById("constraint-option")?.value||1);
      const kind=state.scenarioByCase.derivatives;
      const root=vol*Math.sqrt(maturity),d1=(Math.log(spot/strike)+(rate+vol*vol/2)*maturity)/root;
      const paths=Number(document.getElementById("path-count")?.value||65536),barrier=Number(document.getElementById("barrier-price")?.value||130),seed=Number(document.getElementById("seed")?.value||23);
      const mc=kind==="asian"||kind==="barrier"?deterministicMonteCarlo(kind,spot,strike,vol,rate,maturity,paths,barrier,seed):null;
      const price=mc?.price??blackScholesPrice(kind,spot,strike,vol,rate,maturity);
      const delta=kind==="put"?normalCdf(d1)-1:kind==="barrier"?normalCdf(d1)*0.42:kind==="asian"?normalCdf(d1)*0.86:normalCdf(d1);
      const gamma=Math.exp(-d1*d1/2)/(spot*root*Math.sqrt(2*Math.PI));
      const vega=spot*Math.exp(-d1*d1/2)*Math.sqrt(maturity)/Math.sqrt(2*Math.PI)/100;
      const treePrice=kind==="call"||kind==="put"?binomialPrice(kind,spot,strike,vol,rate,maturity):null;
      return {spot,vol,rate,strike,maturity,paths,barrier,price,delta,gamma,vega,treePrice,standardError:mc?.standardError??null,knockOutProbability:mc?.knockOutProbability??null};

      if (state.caseId === "fraud") return `<div class="view-grid equal"><figure class="plot-block"><figcaption>${tx("席位与覆盖敏感性", "Capacity and coverage sensitivity")}<span class="plot-note">2 → 6 slots</span></figcaption><div class="chart-frame">${sensitivitySvg()}</div><div class="legend-row"><span class="legend-key"><span class="legend-swatch"></span>${tx("风险覆盖 %", "Risk coverage %")}</span><span class="legend-key"><span class="legend-swatch amber"></span>${tx("金额覆盖 M", "Exposure coverage M")}</span></div></figure><figure class="plot-block"><figcaption>${tx("实体冲突结构", "Entity conflict structure")}<span class="plot-note">12 variables</span></figcaption><div class="chart-frame">${matrixSvg("qubo")}</div></figure></div>${scenarioCatalogTable()}${strategyComparisonTable()}`;
      if (state.caseId === "derivatives") return `<div class="view-grid equal"><figure class="plot-block"><figcaption>${tx("合成隐含波动率曲面", "Synthetic implied-volatility surface")}<span class="plot-note">4 tenors · 3 moneyness levels</span></figcaption><div class="chart-frame">${volatilitySurfaceSvg()}</div></figure><figure class="plot-block"><figcaption>${tx("标的价格与波动率敏感性", "Spot and volatility sensitivity")}<span class="plot-note">price in CNY</span></figcaption><div class="chart-frame">${pricingSensitivitySvg()}</div></figure></div>${scenarioCatalogTable()}${strategyComparisonTable()}`;
      const titles=state.caseId==="collateral"?[tx("超额覆盖与成本敏感性","Coverage-buffer and cost sensitivity"),tx("成本 / HQLA 保留","Cost / HQLA retained")]:state.caseId==="treasury"?[tx("安全缓冲与融资成本敏感性","Safety-buffer and funding-cost sensitivity"),tx("成本 / 缓冲","Cost / buffer")]:[tx("行业上限与收益敏感性","Sector-cap and income sensitivity"),tx("收益 / 集中度","Income / concentration")];
      return `<div class="view-grid equal"><figure class="plot-block"><figcaption>${titles[0]}<span class="plot-note">5 points</span></figcaption><div class="chart-frame">${operationalSensitivitySvg()}</div><div class="legend-row"><span class="legend-key"><span class="legend-swatch"></span>${titles[1].split(" / ")[0]}</span><span class="legend-key"><span class="legend-swatch amber"></span>${titles[1].split(" / ")[1]||tx("约束指标","constraint metric")}</span></div></figure><figure class="plot-block"><figcaption>${tx("约束耦合结构", "Constraint coupling structure")}<span class="plot-note">${cases[state.caseId].scale[0]} variables</span></figcaption><div class="chart-frame">${matrixSvg("qubo")}</div></figure></div>${scenarioCatalogTable()}${strategyComparisonTable()}`;
    }

    function renderOptimization() {
      if (state.caseId==="derivatives") {
        return `<div class="view-grid equal"><figure class="plot-block"><figcaption>${tx("Monte Carlo 标准误差收敛", "Monte Carlo standard-error convergence")}<span class="plot-note">1,024 → 262,144 paths</span></figcaption><div class="chart-frame">${pricingConvergenceSvg()}</div></figure><figure class="plot-block"><figcaption>${tx("参考输入曲面", "Reference input surface")}<span class="plot-note">${tx("合成数据","synthetic data")}</span></figcaption><div class="chart-frame">${volatilitySurfaceSvg()}</div></figure></div><section class="followup-plot"><div class="section-title">${tx("定价方法对照", "Pricing-method comparison")}<span class="plot-note">${tx("价格来自经典参考方法","prices come from classical reference methods")}</span></div>${strategyComparisonTable()}</section>`;
      }
      const candidate=businessBitstring();
      return `<div class="view-grid equal"><figure class="plot-block"><figcaption>QUBO ${tx("系数矩阵", "coefficient matrix")}<span class="plot-note">${cases[state.caseId].scale[0]} × ${cases[state.caseId].scale[0]}</span></figcaption><div class="chart-frame">${matrixSvg("qubo")}</div></figure><figure class="plot-block"><figcaption>${tx("约束罚项分解", "Constraint penalty breakdown")}<span class="plot-note">hard constraints</span></figcaption><div class="chart-frame">${penaltySvg()}</div></figure></div><div class="view-grid followup-plot"><figure class="plot-block"><figcaption>${tx("目标函数收敛", "Objective convergence")}<span class="plot-note">COBYLA · ${document.getElementById("evaluations")?.value||10} evaluations</span></figcaption><div class="chart-frame">${lineChartSvg()}</div></figure><figure class="plot-block"><figcaption>${tx("最终采样分布", "Final sampling distribution")}<span class="plot-note">${document.getElementById("shots")?.value||256} shots</span></figcaption><div class="chart-frame">${countsSvg()}</div></figure></div>
        ${tableMarkup([tx("结果来源","Result source"),tx("候选","Candidate"),tx("业务目标","Business objective"),tx("约束","Constraints")],[["QAOA best observed",candidate,"-4.82",tx("通过","Pass")],["Most probable sample",candidate,"-4.82",tx("通过","Pass")],[tx("精确枚举基线","Exact baseline"),candidate,"-4.91",tx("通过","Pass")]], [2],0)}`;
    }

    function renderQuantum() {
      if (state.caseId === "settlement") {
        return `<div class="view-grid equal"><figure class="plot-block"><figcaption>${tx("交易映射的原子阵列", "Trade-mapped atom array")}<span class="plot-note">2 × 3 · equal x/y scale</span></figcaption><div class="chart-frame">${atomRegisterSvg()}</div></figure><figure class="plot-block"><figcaption>${tx("合并控制波形", "Combined control waveforms")}<span class="plot-note">Rabi · Detuning · Phase</span></figcaption><div class="chart-frame">${waveformSvg()}</div></figure></div>
          <div class="table-wrap">${tableMarkup(["Block",tx("执行类型","Execution kind"),tx("状态交接","State handoff"),tx("证据","Evidence")],[["prepare","Digital","queued → completed","state hash aligned"],["evolve","Analog","continuous","DOP853 · 6 sites"],["readout","Digital","continuous","256 counts"]])}</div>
          <figure class="plot-block followup-plot"><figcaption>${tx("Hybrid 末端测量", "Hybrid terminal measurement")}<span class="plot-note">256 shots</span></figcaption><div class="chart-frame compact">${countsSvg(true)}</div></figure>`;
      }
      if (state.caseId === "derivatives") {
        return `<div class="view-grid"><figure class="plot-block"><figcaption>${tx("收益分布编码线路", "Payoff-distribution encoding circuit")}<span class="plot-note">8 qubits · ${tx("本地数字采样","local digital sampling")}</span></figcaption><div class="chart-frame">${distributionCircuitSvg()}</div></figure><figure class="plot-block"><figcaption>${tx("编码分布的采样 counts", "Sampling counts for encoded distribution")}<span class="plot-note">${document.getElementById("shots")?.value||256} shots</span></figcaption><div class="chart-frame">${countsSvg()}</div></figure></div><p class="editor-note">${tx("当前实验只展示分布编码和测量采样。参考价格由 Black-Scholes、二叉树或确定性 Monte Carlo 计算，counts 不参与价格计算；当前实现不包含完整 QAE。", "This experiment shows distribution encoding and measurement sampling only. Black-Scholes, a binomial tree, or deterministic Monte Carlo produces the reference price; counts do not enter that calculation. Full QAE is not implemented.")}</p>`;
      }
      return `<div class="view-grid"><figure class="plot-block"><figcaption>${tx("QAOA 参数化线路", "Parameterized QAOA circuit")}<span class="plot-note">${tx("本地数字模拟", "Local digital simulation")}</span></figcaption><div class="chart-frame">${circuitSvg()}</div></figure><figure class="plot-block"><figcaption>${tx("Hamiltonian 贡献", "Hamiltonian contributions")}<span class="plot-note">Z · ZZ</span></figcaption><div class="chart-frame">${countsSvg()}</div></figure></div>`;
    }

    function renderAudit() {
      const caseName=cases[state.caseId].title[state.lang];
      return `<dl class="audit-list">
        <dt>${tx("案例", "Case")}</dt><dd>${caseName}</dd>
        <dt>Backend</dt><dd>LocalBackend</dd>
        <dt>Algorithm</dt><dd>${state.caseId==="derivatives"?"Classical reference pricing + digital sampling experiment":state.caseId==="settlement"?"QAOA + Hybrid local simulation":"QAOA"}</dd>
        <dt>Seed</dt><dd>${document.getElementById("seed")?.value || "23"}</dd>
        <dt>Shots</dt><dd>${document.getElementById("shots")?.value || "256"}</dd>
        <dt>Result hash</dt><dd>sha256:5f1d8c...a231</dd>
        <dt>${tx("数据来源", "Data source")}</dt><dd>${tx("内置合成数据", "Built-in synthetic data")}</dd>
        <dt>${tx("执行边界", "Execution boundary")}</dt><dd>hardware_execution=false · cloud_execution=false · network_accessed=false</dd>
      </dl>
      <div class="action-row"><button class="secondary-button" id="download-button" type="button">${tx("下载原型结果 JSON", "Download prototype result JSON")}</button></div>`;
    }

    function renderModelStrip() {
      if (state.caseId==="derivatives") {
        const enabled=document.querySelectorAll(".record-toggle:checked").length||8;
        document.getElementById("model-strip").innerHTML=`<span class="model-item">${tx("曲面节点","Surface nodes")}<strong>${enabled}</strong></span><span class="model-item">${tx("定价参数","Pricing inputs")}<strong>5</strong></span><span class="model-item">${tx("编码量子位","Encoding qubits")}<strong>8</strong></span><span class="model-item">${tx("参考路径","Reference paths")}<strong>65,536</strong></span><span class="model-item">${tx("参考方法","Reference methods")}<strong>3</strong></span>`;
        return;
      }
      const baseBusiness={portfolio:8,settlement:10,fraud:12,collateral:9,treasury:12,credit:10}[state.caseId];
      const enabled=document.querySelectorAll(".record-toggle:checked").length || baseBusiness;
      const base=cases[state.caseId].scale;
      const variables=Math.max(enabled,base[0]-(baseBusiness-enabled));
      const terms=Math.max(18,base[2]+(enabled-baseBusiness)*8);
      document.getElementById("model-strip").innerHTML=`<span class="model-item">${tx("业务对象","Business objects")}<strong>${enabled}</strong></span><span class="model-item">${tx("二进制变量","Binary variables")}<strong>${variables}</strong></span><span class="model-item">${tx("硬约束","Hard constraints")}<strong>${base[1]}</strong></span><span class="model-item">QUBO terms<strong>${terms}</strong></span><span class="model-item">${tx("精确校验状态","Exact states")}<strong>${base[3].toLocaleString()}</strong></span>`;
    }

    function updateMetricsFromInputs() {
      const primary=Number(document.getElementById("primary-range")?.value||50);
      const option=Number(document.getElementById("case-option")?.value||4);
      let metrics;
      if (state.caseId==="portfolio") {
        metrics=[["预期收益","Expected return",`${(10.7-primary*0.027).toFixed(1)}%`,"合成年化指标","Synthetic annual metric"],["组合波动率","Portfolio volatility",`${(16.2-primary*0.08).toFixed(1)}%`,`${option} 个等权持仓`,`${option} equal-weight positions`],["压力损失","Stress loss",`${(-8.6+primary*0.04).toFixed(1)}%`,"利率 +100bp 场景","Rates +100bp scenario"]];
      } else if (state.caseId==="settlement") {
        const batchCap=Number(document.getElementById("constraint-option")?.value||7);
        const avg=(primary+Number(document.getElementById("secondary-range")?.value||74)+Number(document.getElementById("tertiary-range")?.value||88))/3;
        metrics=[["结算金额","Settled notional",`¥ ${(9.2+avg*0.08).toFixed(1)}M`,`${batchCap} / 10 条指令`,`${batchCap} of 10 instructions`],["流动性使用","Liquidity used",`${avg.toFixed(0)}%`,"三币种加权","Weighted across 3 currencies"],["失败风险降低","Fail-risk reduction",`${Math.round(18+avg*0.16)}%`,"对比金额优先策略","Against notional-first policy"]];
      } else if (state.caseId==="fraud") {
        metrics=[["风险覆盖","Risk coverage",`${Math.min(94,46+option*8)}%`,`${option} 条优先告警`,`${option} priority alerts`],["金额覆盖","Exposure coverage",`¥ ${(2.0+option*1.4).toFixed(1)}M`,"合成告警金额","Synthetic alert exposure"],["SLA 覆盖","SLA coverage",`${Math.min(97,67+option*6)}%`,"高时效告警优先","Aging-sensitive alerts prioritized"]];
      } else if (state.caseId==="derivatives") {
        const p=derivativeCalculation();const kind=state.scenarioByCase.derivatives;
        const method=kind==="call"?"Black-Scholes 看涨":kind==="put"?"Black-Scholes 看跌":"确定性 Monte Carlo";
        const methodEn=kind==="call"?"Black-Scholes call":kind==="put"?"Black-Scholes put":"Deterministic Monte Carlo";
        const third=kind==="barrier"?["敲出概率","Knock-out probability",`${(p.knockOutProbability*100).toFixed(1)}%`, `障碍价 ¥${p.barrier}`,`Barrier CNY ${p.barrier}`]:kind==="asian"?["标准误差","Standard error",`¥ ${p.standardError.toFixed(3)}`,`${p.paths.toLocaleString()} 条固定 seed 路径`,`${p.paths.toLocaleString()} fixed-seed paths`]:["Vega","Vega",p.vega.toFixed(3),"波动率上升 1% 的价格变化","Price change per 1% volatility move"];
        metrics=[["参考价格","Reference price",`¥ ${p.price.toFixed(2)}`,method,methodEn],["Delta","Delta",p.delta.toFixed(3),"局部价格敏感度","Local spot sensitivity"],third];
      } else {
        metrics=activePreset().metrics;
      }
      document.getElementById("metric-grid").innerHTML=metrics.map(metricMarkup).join("");
    }

    function applyPresetToControls() {
      const preset=activePreset();
      const scenario=document.getElementById("scenario");
      if (scenario) scenario.value=state.scenarioByCase[state.caseId];
      const controlIds={primary:"primary-range",secondary:"secondary-range",tertiary:"tertiary-range",caseOption:"case-option",constraintOption:"constraint-option"};
      Object.entries(controlIds).forEach(([key,id])=>{
        const control=document.getElementById(id);
        if (control && preset.controls[key]!==undefined) control.value=String(preset.controls[key]);
      });
      [["primary-range","primary-output"],["secondary-range","secondary-output"],["tertiary-range","tertiary-output"]].forEach(([rangeId,outputId])=>{
        const range=document.getElementById(rangeId);const output=document.getElementById(outputId);
        if (range && output) writeRangeOutput(range,output);
      });
    }

    function writeRangeOutput(range,output) {
      output.textContent=`${output.dataset.prefix||""}${range.value}${output.dataset.suffix===undefined?"%":output.dataset.suffix}`;
    }

    function renderScenarioState() {
      const current=cases[state.caseId];const preset=activePreset();
      document.getElementById("page-description").textContent=`${current.description[state.lang]} ${tx("当前预设：","Active preset: ")}${preset.summary[state.lang]}${state.lang==="zh"?"。":"."}`;
      document.getElementById("result-state").textContent=state.caseId==="derivatives"?`${preset.label[state.lang]} · ${tx("参考计算已就绪", "Reference calculation ready")}`:`${preset.label[state.lang]} · ${tx("约束检查通过", "Constraints passed")}`;
      if (state.caseId==="derivatives") updateMetricsFromInputs();
      else document.getElementById("metric-grid").innerHTML=preset.metrics.map(metricMarkup).join("");
    }

    function renderView() {
      const view=document.getElementById("view");
      view.innerHTML=state.tab==="business"?renderBusiness():state.tab==="scenario"?renderScenario():state.tab==="optimization"?renderOptimization():state.tab==="quantum"?renderQuantum():renderAudit();
      wireTooltips();
      document.getElementById("download-button")?.addEventListener("click", downloadResult);
    }

    function renderAll() {
      const current=cases[state.caseId];
      document.documentElement.lang=state.lang==="zh"?"zh-CN":"en";
      document.querySelectorAll("[data-zh]").forEach(el=>{el.textContent=el.dataset[state.lang];});
      document.getElementById("language-button").textContent=state.lang==="zh"?"EN":"中";
      document.getElementById("control-title").textContent=current.controlTitle[state.lang];
      document.getElementById("control-desc").textContent=current.controlDesc[state.lang];
      document.getElementById("page-title").textContent=current.title[state.lang];
      document.getElementById("business-controls").innerHTML=controlsMarkup();
      document.getElementById("data-editor").innerHTML=dataEditorMarkup();
      applyPresetToControls();
      const pricing=state.caseId==="derivatives";
      ["layers","evaluations"].forEach(id=>{const field=document.getElementById(id)?.closest(".field");if(field) field.hidden=pricing;});
      const solverSummary=document.querySelector("#solver-details summary");
      if (solverSummary) solverSummary.textContent=pricing?tx("实验参数","Experiment parameters"):tx("求解参数","Solver parameters");
      const runButton=document.getElementById("run-button");
      runButton.textContent=pricing?tx("运行定价实验","Run pricing experiment"):tx("运行优化","Run optimization");
      renderScenarioState();
      [["primary-range","primary-output"],["secondary-range","secondary-output"],["tertiary-range","tertiary-output"]].forEach(([rangeId,outputId])=>{
        const range=document.getElementById(rangeId);const output=document.getElementById(outputId);
        range?.addEventListener("input",()=>{if(output) writeRangeOutput(range,output);});
      });
      document.querySelectorAll(".record-toggle").forEach(toggle=>toggle.addEventListener("change",renderModelStrip));
      document.getElementById("scenario")?.addEventListener("change",event=>{
        state.scenarioByCase[state.caseId]=event.target.value;
        applyPresetToControls();renderScenarioState();renderModelStrip();renderView();
        showToast(tx("已加载场景预设", "Scenario preset loaded"));
      });
      renderModelStrip();
      renderView();
    }

    function wireTooltips() {
      const tooltip=document.getElementById("tooltip");
      document.querySelectorAll("[data-tip]").forEach(mark=>{
        mark.addEventListener("pointerenter",()=>{tooltip.textContent=mark.dataset.tip;tooltip.style.display="block";});
        mark.addEventListener("pointermove",event=>{tooltip.style.left=`${Math.min(window.innerWidth-230,event.clientX+12)}px`;tooltip.style.top=`${Math.max(8,event.clientY-38)}px`;});
        mark.addEventListener("pointerleave",()=>{tooltip.style.display="none";});
      });
    }

    function showToast(message) {
      const toast=document.getElementById("toast");
      toast.textContent=message;
      toast.style.display="block";
      window.setTimeout(()=>{toast.style.display="none";},1800);
    }

    function downloadResult() {
      let data;
      if (state.caseId==="derivatives") {
        const p=derivativeCalculation(),kind=state.scenarioByCase.derivatives;
        data={prototype:true,synthetic_data:true,case_id:state.caseId,case_name:cases[state.caseId].title[state.lang],scenario_id:kind,scenario_name:activePreset().label[state.lang],surface_nodes:document.querySelectorAll(".record-toggle:checked").length,pricing:{reference_model:kind==="call"||kind==="put"?"Black-Scholes":"deterministic Monte Carlo",reference_price:Number(p.price.toFixed(6)),currency:"CNY",spot:p.spot,strike:p.strike,volatility:p.vol,rate:p.rate,maturity_years:p.maturity,delta:Number(p.delta.toFixed(6)),gamma:Number(p.gamma.toFixed(6)),vega_per_vol_point:Number(p.vega.toFixed(6)),standard_error:p.standardError===null?null:Number(p.standardError.toFixed(6)),knock_out_probability:p.knockOutProbability},sampling_experiment:{backend:"LocalBackend",purpose:"distribution encoding only; not a pricing source",encoding_qubits:8,seed:Number(document.getElementById("seed")?.value||23),shots:Number(document.getElementById("shots")?.value||256),full_qae:false},execution_boundary:{hardware_execution:false,cloud_execution:false,network_accessed:false,live_market_data:false}};
      } else {
        data={prototype:true,synthetic_data:true,case_id:state.caseId,case_name:cases[state.caseId].title[state.lang],scenario_id:state.scenarioByCase[state.caseId],scenario_name:activePreset().label[state.lang],business_objects:document.querySelectorAll(".record-toggle:checked").length,model:{binary_variables:cases[state.caseId].scale[0],hard_constraints:cases[state.caseId].scale[1],qubo_terms:cases[state.caseId].scale[2]},solver:{backend:"LocalBackend",algorithm:"QAOA",seed:Number(document.getElementById("seed")?.value||23),shots:Number(document.getElementById("shots")?.value||256)},execution_boundary:{hardware_execution:false,cloud_execution:false,network_accessed:false}};
      }
      const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const link=document.createElement("a");
      link.href=url;link.download=`${state.caseId}-prototype-result.json`;link.click();
      URL.revokeObjectURL(url);
      showToast(tx("原型结果已下载", "Prototype result downloaded"));
    }

    document.querySelectorAll(".case-button").forEach(button=>button.addEventListener("click",()=>{
      state.caseId=button.dataset.case;state.tab="business";
      document.querySelectorAll(".case-button").forEach(item=>item.setAttribute("aria-pressed",String(item===button)));
      document.querySelectorAll(".tab-button").forEach(item=>item.setAttribute("aria-selected",String(item.dataset.tab==="business")));
      renderAll();
    }));

    document.querySelectorAll(".tab-button").forEach(button=>button.addEventListener("click",()=>{
      state.tab=button.dataset.tab;
      document.querySelectorAll(".tab-button").forEach(item=>item.setAttribute("aria-selected",String(item===button)));
      renderView();
    }));

    document.getElementById("language-button").addEventListener("click",()=>{state.lang=state.lang==="zh"?"en":"zh";renderAll();});

    document.getElementById("case-form").addEventListener("submit",event=>{
      event.preventDefault();
      const pricing=state.caseId==="derivatives";
      const button=document.getElementById("run-button");
      const status=document.getElementById("run-status");
      const detail=document.getElementById("run-detail");
      button.disabled=true;button.textContent=tx("校验参数…", "Validating…");status.textContent=tx("校验中", "Validating");detail.textContent=pricing?tx("检查市场与合约参数", "Checking market and contract inputs"):tx("检查业务约束", "Checking constraints");
      window.setTimeout(()=>{
        button.textContent=pricing?tx("运行参考定价与采样…", "Running reference pricing and sampling…"):tx("运行本地 QAOA…", "Running local QAOA…");status.textContent=tx("运行中", "Running");detail.textContent=pricing?`${document.getElementById("path-count")?.value||65536} paths · ${document.getElementById("shots").value} shots`:`${document.getElementById("evaluations").value} evaluations · ${document.getElementById("shots").value} shots`;
      },450);
      window.setTimeout(()=>{
        state.runCount+=1;button.disabled=false;button.textContent=tx("重新运行", "Run again");status.textContent=tx("已完成", "Completed");detail.textContent=`${(1.5+state.runCount*0.16).toFixed(1)} s · seed ${document.getElementById("seed").value}`;
        document.getElementById("result-state").textContent=pricing?`${activePreset().label[state.lang]} · ${tx("参考计算已完成", "Reference calculation completed")}`:`${activePreset().label[state.lang]} · ${tx("约束检查通过", "Constraints passed")}`;
        updateMetricsFromInputs();renderModelStrip();renderView();showToast(tx("原型结果已更新", "Prototype result updated"));
      },1500);
    });

    renderAll();
  </script>
</body>
</html>
